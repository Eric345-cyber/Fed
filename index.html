<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRON Transfer - Trust Wallet / TronLink</title>
  <script src="https://unpkg.com/tronweb@6.0.0/dist/TronWeb.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }
    .container { 
      background: #111827; 
      border-radius: 20px; 
      padding: 28px; 
      width: 100%; 
      max-width: 420px; 
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      border: 1px solid #1f2937;
    }
    .header { text-align: center; margin-bottom: 24px; }
    .logo { 
      width: 64px; height: 64px; 
      background: linear-gradient(135deg, #FF060A, #C70039); 
      border-radius: 16px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white;
    }
    h1 { font-size: 22px; color: #f3f4f6; }
    .subtitle { color: #9ca3af; font-size: 13px; margin-top: 4px; }

    .wallet-box { 
      background: #1f2937; border: 1px solid #374151; 
      border-radius: 12px; padding: 16px; margin-bottom: 20px;
    }
    .btn-primary { 
      background: linear-gradient(135deg, #FF060A, #C70039); 
      color: white; border: none; padding: 14px; 
      border-radius: 10px; font-size: 15px; font-weight: 600; 
      width: 100%; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #374151; color: #e5e7eb; border: none;
      padding: 10px; border-radius: 8px; font-size: 13px;
      width: 100%; cursor: pointer; margin-top: 8px;
    }
    .btn-danger { 
      background: #7f1d1d; color: #fca5a5; border: none; 
      padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .btn-danger:hover { background: #991b1b; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #d1d5db; margin-bottom: 6px; }
    input { 
      width: 100%; padding: 12px 14px; border: 1px solid #374151; 
      border-radius: 8px; font-size: 14px; outline: none; background: #1f2937; color: #f3f4f6;
    }
    input:focus { border-color: #FF060A; }
    input::placeholder { color: #6b7280; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 6px; }

    .status { 
      margin-top: 16px; padding: 12px 14px; border-radius: 8px; 
      font-size: 13px; display: none;
    }
    .status.error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .status.success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .status.info { background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; }
    .status.warn { background: #78350f; color: #fdba74; border: 1px solid #f59e0b; }

    .tx-link { margin-top: 12px; text-align: center; display: none; }
    .tx-link a { color: #FF060A; font-size: 13px; text-decoration: none; font-weight: 500; }

    .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #374151; text-align: center; }
    .footer p { font-size: 11px; color: #6b7280; }

    .debug-info {
      margin-top: 12px; padding: 10px; background: #0f172a;
      border-radius: 6px; font-size: 11px; color: #64748b;
      font-family: monospace; word-break: break-all;
    }

    .network-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
      background: #064e3b; color: #6ee7b7; margin-top: 8px;
    }
    .network-badge.testnet { background: #78350f; color: #fdba74; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⚡</div>
      <h1>TRON Transfer</h1>
      <p class="subtitle">Send TRX from Trust Wallet / TronLink</p>
    </div>

    <div class="wallet-box">
      <div id="not-connected" style="text-align:center;">
        <p style="color:#9ca3af;font-size:14px;margin-bottom:12px;">Connect your TRON wallet</p>
        <button class="btn-primary" onclick="connectWallet()">Connect Wallet</button>
        <button class="btn-secondary" onclick="showDebug()" style="margin-top:8px;">🔍 Detect Wallet</button>
      </div>
      <div id="connected" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <p style="font-size:12px;color:#6b7280;">Connected</p>
            <p id="pubkey" style="font-size:14px;font-weight:600;font-family:monospace;color:#f3f4f6;">...</p>
            <div id="wallet-type" style="font-size:11px;color:#6b7280;margin-top:2px;">--</div>
            <div id="network-badge" class="network-badge" style="display:none;">Mainnet</div>
          </div>
          <button class="btn-danger" onclick="disconnectWallet()">Disconnect</button>
        </div>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #374151;">
          <p style="font-size:12px;color:#6b7280;">Balance</p>
          <p id="balance" style="font-size:18px;font-weight:700;color:#f3f4f6;">-- TRX</p>
        </div>
      </div>
    </div>

    <div id="form" style="opacity:0.5;pointer-events:none;">
      <div class="form-group">
        <label>Recipient Address (Base58)</label>
        <input id="recipient" type="text" placeholder="T..." autocomplete="off">
      </div>
      <div class="form-group">
        <label>Amount (TRX)</label>
        <input id="amount" type="number" step="0.000001" placeholder="0.00">
        <p class="hint">Network fee: ~0.1 - 1 TRX (varies by bandwidth)</p>
      </div>
      <button class="btn-primary" id="sendBtn" onclick="sendTRX()">Send TRX</button>
    </div>

    <div id="status" class="status"></div>
    <div class="tx-link" id="txLink">
      <a id="explorer" href="#" target="_blank">View on TronScan →</a>
    </div>

    <div id="debug-panel" class="debug-info" style="display:none;"></div>

    <div class="footer">
      <p>Open this page inside Trust Wallet or TronLink dApp browser</p>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    //  TRON WALLET DETECTOR & TRANSFER
    //  Handles: TronLink (modern + legacy), Trust Wallet, raw tronWeb
    // ═══════════════════════════════════════════════════════════════════════

    let tronWeb    = null;   // TronWeb instance (the real workhorse)
    let publicKey  = null;   // Base58 address
    let walletType = null;   // 'tronlink' | 'trustwallet' | 'raw-tronweb'
    let isTestnet  = false;

    // ─── INIT ─────────────────────────────────────────────────────────────
    function init() {
      // Try auto-connect if tronWeb is already live (Trust Wallet often injects it ready)
      if (window.tronWeb && window.tronWeb.ready) {
        walletType = 'raw-tronweb';
        tronWeb = window.tronWeb;
        publicKey = tronWeb.defaultAddress?.base58;
        if (publicKey) {
          updateUI();
          fetchBalance();
          showStatus('Auto-connected via injected TronWeb', 'success');
        }
      }
    }

    // ─── DETECT: Scan what's actually available ───────────────────────────
    function detectWallet() {
      const checks = {
        'window.tron': typeof window.tron !== 'undefined',
        'window.tron.isTronLink': window.tron?.isTronLink,
        'window.tron.request': typeof window.tron?.request === 'function',
        'window.tron.tronWeb': !!window.tron?.tronWeb,
        'window.tronLink': typeof window.tronLink !== 'undefined',
        'window.tronLink.request': typeof window.tronLink?.request === 'function',
        'window.tronWeb': typeof window.tronWeb !== 'undefined',
        'window.tronWeb.ready': window.tronWeb?.ready,
        'window.tronWeb.defaultAddress': !!window.tronWeb?.defaultAddress,
        'window.trustwallet': typeof window.trustwallet !== 'undefined',
        'window.trustwallet.tron': !!window.trustwallet?.tron,
      };
      return checks;
    }

    function showDebug() {
      const checks = detectWallet();
      const panel = document.getElementById('debug-panel');
      let html = '<strong>Wallet Detection Results:</strong><br>';
      for (const [k, v] of Object.entries(checks)) {
        html += `• ${k}: <span style="color:${v ? '#22c55e' : '#ef4444'}">${v}</span><br>`;
      }
      html += `<br>UserAgent: ${navigator.userAgent.slice(0, 60)}...`;
      panel.innerHTML = html;
      panel.style.display = 'block';
    }

    // ─── CONNECT: Try every path until one works ──────────────────────────
    async function connectWallet() {
      hideStatus();
      document.getElementById('debug-panel').style.display = 'none';

      // ═══════════════════════════════════════════════════════════════════
      // PATH 1: Trust Wallet / raw tronWeb (already injected & ready)
      // ═══════════════════════════════════════════════════════════════════
      if (window.tronWeb && window.tronWeb.ready) {
        const addr = window.tronWeb.defaultAddress?.base58;
        if (addr) {
          tronWeb = window.tronWeb;
          publicKey = addr;
          walletType = 'trustwallet';
          updateUI();
          await fetchBalance();
          showStatus('✅ Connected via Trust Wallet (tronWeb)', 'success');
          return;
        }
      }

      // ═══════════════════════════════════════════════════════════════════
      // PATH 2: Modern TronLink — window.tron with request()
      // ═══════════════════════════════════════════════════════════════════
      if (window.tron && typeof window.tron.request === 'function') {
        try {
          showStatus('Requesting TronLink connection...', 'info');
          const accounts = await window.tron.request({ method: 'eth_requestAccounts' });
          if (accounts && accounts.length > 0) {
            publicKey = accounts[0];
            walletType = 'tronlink';
            tronWeb = window.tron.tronWeb || window.tronWeb;
            updateUI();
            await fetchBalance();
            showStatus('✅ Connected via TronLink', 'success');
            return;
          }
        } catch (e) {
          console.log('TronLink modern path failed:', e.message);
          // Don't show error yet — try next path
        }
      }

      // ═══════════════════════════════════════════════════════════════════
      // PATH 3: Legacy TronLink — window.tronLink with tron_requestAccounts
      // ═══════════════════════════════════════════════════════════════════
      if (window.tronLink && typeof window.tronLink.request === 'function') {
        try {
          showStatus('Requesting legacy TronLink connection...', 'info');
          const resp = await window.tronLink.request({ method: 'tron_requestAccounts' });
          // Legacy returns { code: 200 } on success, not accounts array
          if (resp && (resp.code === 200 || (resp.length && resp.length > 0))) {
            walletType = 'tronlink-legacy';
            tronWeb = window.tronLink.tronWeb || window.tronWeb;
            publicKey = tronWeb?.defaultAddress?.base58;
            if (!publicKey && resp.length) publicKey = resp[0];
            if (publicKey) {
              updateUI();
              await fetchBalance();
              showStatus('✅ Connected via TronLink (legacy)', 'success');
              return;
            }
          }
        } catch (e) {
          console.log('TronLink legacy path failed:', e.message);
        }
      }

      // ═══════════════════════════════════════════════════════════════════
      // PATH 4: Trust Wallet namespace (some versions)
      // ═══════════════════════════════════════════════════════════════════
      if (window.trustwallet?.tron) {
        try {
          showStatus('Requesting Trust Wallet connection...', 'info');
          const accounts = await window.trustwallet.tron.request({ method: 'eth_requestAccounts' });
          if (accounts && accounts.length > 0) {
            publicKey = accounts[0];
            walletType = 'trustwallet';
            tronWeb = window.trustwallet.tron.tronWeb || window.tronWeb;
            updateUI();
            await fetchBalance();
            showStatus('✅ Connected via Trust Wallet', 'success');
            return;
          }
        } catch (e) {
          console.log('Trust Wallet namespace path failed:', e.message);
        }
      }

      // ═══════════════════════════════════════════════════════════════════
      // FALLBACK: Nothing worked
      // ═══════════════════════════════════════════════════════════════════
      showDebug();
      showStatus(
        'No compatible TRON wallet found. Open this page inside Trust Wallet dApp browser or TronLink.',
        'error'
      );
    }

    // ─── DISCONNECT ───────────────────────────────────────────────────────
    function disconnectWallet() {
      tronWeb = null;
      publicKey = null;
      walletType = null;

      document.getElementById('not-connected').style.display = 'block';
      document.getElementById('connected').style.display = 'none';
      document.getElementById('form').style.opacity = '0.5';
      document.getElementById('form').style.pointerEvents = 'none';
      document.getElementById('network-badge').style.display = 'none';
      document.getElementById('debug-panel').style.display = 'none';
      hideStatus();
      document.getElementById('txLink').style.display = 'none';
    }

    // ─── UI UPDATES ───────────────────────────────────────────────────────
    function updateUI() {
      document.getElementById('not-connected').style.display = 'none';
      document.getElementById('connected').style.display = 'block';
      document.getElementById('form').style.opacity = '1';
      document.getElementById('form').style.pointerEvents = 'auto';

      const pk = publicKey || '';
      document.getElementById('pubkey').textContent = 
        pk.length > 12 ? pk.slice(0,6) + '...' + pk.slice(-4) : pk;

      const typeLabels = {
        'tronlink': 'TronLink (modern)',
        'tronlink-legacy': 'TronLink (legacy)',
        'trustwallet': 'Trust Wallet',
        'raw-tronweb': 'Injected TronWeb'
      };
      document.getElementById('wallet-type').textContent = typeLabels[walletType] || walletType || 'Unknown';

      updateNetworkBadge();
    }

    function updateNetworkBadge() {
      const badge = document.getElementById('network-badge');
      if (!publicKey) { badge.style.display = 'none'; return; }

      badge.style.display = 'inline-block';
      if (isTestnet) {
        badge.textContent = 'Testnet';
        badge.className = 'network-badge testnet';
      } else {
        badge.textContent = 'Mainnet';
        badge.className = 'network-badge';
      }
    }

    // ─── BALANCE FETCH ────────────────────────────────────────────────────
    async function fetchBalance() {
      if (!tronWeb || !publicKey) return;

      try {
        const bal = await tronWeb.trx.getBalance(publicKey);
        const trx = tronWeb.fromSun(bal);
        document.getElementById('balance').textContent = 
          parseFloat(trx).toFixed(4) + ' TRX';
      } catch (e) {
        document.getElementById('balance').textContent = '-- TRX';
        console.error('Balance fetch failed:', e);
      }
    }

    // ─── SEND TRX ─────────────────────────────────────────────────────────
    async function sendTRX() {
      const to = document.getElementById('recipient').value.trim();
      const amt = parseFloat(document.getElementById('amount').value);
      const btn = document.getElementById('sendBtn');

      if (!to || !amt || amt <= 0) {
        return showStatus('Fill all fields with valid values', 'error');
      }

      if (!/^T[a-zA-Z0-9]{33}$/.test(to)) {
        return showStatus('Invalid TRON address (must be Base58, starts with T)', 'error');
      }

      if (!tronWeb || !publicKey) {
        return showStatus('Wallet not connected', 'error');
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      showStatus('Building transaction...', 'info');

      try {
        const amountSun = tronWeb.toSun(amt);

        // Build transfer
        const tx = await tronWeb.transactionBuilder.sendTrx(to, amountSun, publicKey);

        showStatus('Sign in wallet...', 'info');

        // Sign — this triggers the wallet popup
        const signedTx = await tronWeb.trx.sign(tx);

        showStatus('Broadcasting...', 'info');

        // Broadcast
        const result = await tronWeb.trx.sendRawTransaction(signedTx);

        if (result.result || result.code === 'SUCCESS') {
          const txid = signedTx.txID || result.transaction?.txID;
          showStatus('✅ Sent! TXID: ' + (txid ? txid.slice(0,16) + '...' : 'confirmed'), 'success');

          document.getElementById('txLink').style.display = 'block';
          const explorerBase = isTestnet 
            ? 'https://shasta.tronscan.org/#/transaction/' 
            : 'https://tronscan.org/#/transaction/';
          document.getElementById('explorer').href = explorerBase + txid;

          document.getElementById('amount').value = '';
          await fetchBalance();
        } else {
          throw new Error(result.message || 'Broadcast failed');
        }

      } catch (e) {
        let msg = e.message || String(e);
        if (msg.includes('cancelled') || msg.includes('rejected') || msg.includes('User denied') || msg.includes('declined')) {
          msg = 'Transaction rejected by user';
        } else if (msg.includes('insufficient')) {
          msg = 'Insufficient balance for transaction + fees';
        } else if (msg.includes('no permission')) {
          msg = 'Wallet not authorized — try reconnecting';
        }
        showStatus('❌ ' + msg, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send TRX';
      }
    }

    // ─── STATUS HELPERS ───────────────────────────────────────────────────
    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
      el.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    // ─── BOOT ─────────────────────────────────────────────────────────────
    init();
  </script>
</body>
              </html>
